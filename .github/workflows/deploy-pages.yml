name: Deploy ZiNaSite to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - public/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build production site
        env:
          PUBLIC_API_URL: ${{ secrets.ZINA_PUBLIC_APPS_SCRIPT_API_URL }}
          PROTECTED_API_URL: ${{ secrets.ZINA_PROTECTED_APPS_SCRIPT_API_URL }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.ZINA_GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          cp -R public _site
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            backendProvider: 'google-apps-script',
            publicAppsScriptApiUrl: process.env.PUBLIC_API_URL || '',
            protectedAppsScriptApiUrl: process.env.PROTECTED_API_URL || '',
            googleOAuthClientId: process.env.GOOGLE_OAUTH_CLIENT_ID || ''
          };
          const webAppPattern = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
          const clientPattern = /^[0-9]+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/;
          if (!webAppPattern.test(config.publicAppsScriptApiUrl) ||
              !webAppPattern.test(config.protectedAppsScriptApiUrl) ||
              !clientPattern.test(config.googleOAuthClientId)) {
            throw new Error('Required ZiNa production configuration is missing or invalid.');
          }
          fs.writeFileSync(
            '_site/zina-runtime-config.js',
            `window.__ZINA_RUNTIME_CONFIG = Object.freeze(${JSON.stringify(config).replace(/</g, '\\u003c')});\n`,
            { mode: 0o600 }
          );
          NODE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
