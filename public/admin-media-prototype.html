<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZiNa A5B GitHub Media Prototype</title>
  <link rel="stylesheet" href="styles.css">
  <script src="zina-runtime-config.js"></script><script src="zina-config.js"></script><script src="google-auth-provider.js"></script><script src="google-apps-script-provider.js?v=20260812-public-cache"></script>
</head>
<body>
  <main class="content">
    <section class="panel">
      <p class="eyebrow">A5B isolated test only</p><h1>GitHub Pages media prototype</h1>
      <p id="provider-warning" class="error-message" hidden>This prototype is available only when the Google Apps Script test provider is selected.</p>
      <form id="login-form"><button class="button" type="submit">Sign in</button></form>
      <section id="media-panel" hidden>
        <form id="upload-form" class="stack">
          <label>Usage<select id="usage"><option value="homepage">Homepage</option><option value="team">Team</option><option value="article">Article</option></select></label>
          <label>JPEG, PNG, or WebP (maximum 5 MB)<input id="media-file" type="file" accept="image/jpeg,image/png,image/webp" required></label>
          <label>Romanian alt text<input id="alt-ro" maxlength="500"></label>
          <button class="button" type="submit">Upload test image</button>
        </form>
        <p id="media-message" role="status" aria-live="polite"></p>
        <div id="media-list" class="cards"></div>
        <button id="logout" class="button ghost" type="button">Forget token and sign out</button>
      </section>
    </section>
  </main>
  <script src="auth-service.js"></script>
  <script>
    const panel=document.getElementById('media-panel'),message=document.getElementById('media-message'),list=document.getElementById('media-list');
    function options(){return {usage:document.getElementById('usage').value,entityType:document.getElementById('usage').value,altTextRo:document.getElementById('alt-ro').value};}
    async function loadMedia(){const items=await GoogleAppsScriptProvider.listMedia();list.replaceChildren();items.filter(item=>item.status==='active').forEach(item=>{const card=document.createElement('article');card.className='card';const image=document.createElement('img');image.src=item.publicUrl;image.alt=item.altTextRo||'A5 test image';image.style.maxWidth='260px';const title=document.createElement('h3');title.textContent=item.originalFilename;const details=document.createElement('p');details.textContent=`${item.mimeType} · ${item.size} bytes · ${item.usage}`;const replacement=document.createElement('input');replacement.type='file';replacement.accept='image/jpeg,image/png,image/webp';const replace=document.createElement('button');replace.className='button ghost';replace.type='button';replace.textContent='Replace';replace.onclick=async()=>{if(!replacement.files[0])return;try{await GoogleAppsScriptProvider.replaceMedia(item.id,replacement.files[0],{usage:item.usage,entityType:item.entityType,entityId:item.entityId,altTextRo:item.altTextRo});message.textContent='Replacement completed.';await loadMedia();}catch(error){message.textContent=`${error.code||'ERROR'}: ${error.message}`;}};const remove=document.createElement('button');remove.className='button danger';remove.type='button';remove.textContent='Delete';remove.onclick=async()=>{if(!confirm('Soft-delete this isolated test image?'))return;try{await GoogleAppsScriptProvider.deleteMedia(item.id);message.textContent='Deletion completed.';await loadMedia();}catch(error){message.textContent=`${error.code||'ERROR'}: ${error.message}`;}};card.append(image,title,details,replacement,replace,remove);list.append(card);});}
    document.getElementById('upload-form').addEventListener('submit',async event=>{event.preventDefault();message.textContent='Uploading…';try{await GoogleAppsScriptProvider.uploadMedia(document.getElementById('media-file').files[0],options());message.textContent='Upload completed.';event.target.reset();await loadMedia();}catch(error){message.textContent=`${error.code||'ERROR'}: ${error.message}`;}});
    document.getElementById('login-form').addEventListener('submit',event=>event.preventDefault());
    document.getElementById('logout').addEventListener('click',async()=>{await AuthService.signOut();panel.hidden=true;});
    AuthService.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session?.user){panel.hidden=false;try{await loadMedia();}catch(error){message.textContent=`${error.code||'ERROR'}: ${error.message}`;}}else if(event==='SIGNED_OUT')panel.hidden=true;});
    (async()=>{if(!ZinaConfig.isGoogle()){document.getElementById('provider-warning').hidden=false;document.getElementById('login-form').hidden=true;return;}const user=await AuthService.getCurrentUser();if(user){panel.hidden=false;await loadMedia();}})();
  </script>
</body>
</html>
